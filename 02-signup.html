<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SurplusLink - Create your account</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="02-signup.css" rel="stylesheet"/>
</head>
<body>
<div class="signup-layout">
<div class="signup-container">
<div class="header-text">
<h1 class="display-title">Create your account</h1>
<p class="subtitle">Join SurplusLink and help reduce food waste, share good food.</p>
</div>
<div class="role-selector">
<input type="radio" name="role" id="role-provider" class="hidden-radio" />
<label class="role-card" for="role-provider">
<div class="check-badge"><img alt="Selected" src="./assets/02-signup/selected-icon.svg"/></div>
<img alt="Provider" class="role-icon" src="./assets/02-signup/provider-icon.svg"/>
<h3>I'm a Food Provider</h3>
<p>List surplus food from your business or organization</p>
</label>

<input type="radio" name="role" id="role-recipient" class="hidden-radio" checked />
<label class="role-card" for="role-recipient">
<div class="check-badge"><img alt="Selected" src="./assets/02-signup/selected-icon.svg"/></div>
<img alt="Recipient" class="role-icon" src="./assets/02-signup/recipient-icon.svg"/>
<h3>I'm a Recipient</h3>
<p>Receive surplus food for your community or organization</p>
</label>
</div>
<form action="03-feed.html" class="signup-form">
<div class="field">
<label>Recipient type</label>
<select class="select">
<option>Select recipient type</option>
<option>NGO / Non-profit Organization</option>
<option>Community Kitchen</option>
<option>Shelter Home</option>
<option>Individual / Volunteer</option>
<option>Food Bank</option>
<option>Other</option>
</select>
</div>
<div class="field">
<label>Full name</label>
<input class="input" placeholder="Enter your full name" type="text"/>
</div>
<div class="field">
<label>Email address</label>
<input class="input" placeholder="Enter your email address" type="email"/>
</div>
<div class="field">
<label>Phone number</label>
<input class="input" placeholder="Enter your phone number" type="tel"/>
</div>
<div class="field">
<label>Organisation name</label>
<input class="input" placeholder="Enter your organisation name" type="text"/>
</div>
<div class="field">
<label>Registration number (if applicable)</label>
<input class="input" placeholder="Enter registration number" type="text"/>
</div>
<div class="field">
<label>Upload verification document</label>
<label class="upload-zone">
<input type="file" style="display: none;" accept=".pdf,.jpg,.png" />
<img alt="Upload" src="./assets/02-signup/upload-icon.svg"/>
<div class="upload-text">
<span class="upload-title">Click to upload or drag and drop</span><br/>
<span class="upload-subtitle">PDF, JPG, PNG (Max 5MB)</span>
</div>
</label>
</div>
<label class="checkbox-label terms-label">
<input type="checkbox"/>
<span>I agree to the <a class="brand-link" href="#">Terms of Service</a> and <a class="brand-link" href="#">Privacy Policy</a>.</span>
</label>
<button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
<p class="login-prompt">
                    Already have an account&bull; <a class="brand-link font-semibold" href="01-login.html">Log in</a>
</p>
</form>
</div>
</div>
</body>
</html>
